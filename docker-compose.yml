services:
  postgres:
    image: postgres:16-alpine
    container_name: narintown-postgres
    environment:
      POSTGRES_USER: narintown
      POSTGRES_PASSWORD: narintown
      POSTGRES_DB: narintown
    ports:
      - "5432:5432"
    volumes:
      - narintown-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narintown"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: narintown-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: narintown-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

volumes:
  narintown-pg-data:
